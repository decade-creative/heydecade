backend:
  name: Decade Dashboard
  repo: heydecade
  branch: main # atau master

media_folder: "images" # tempat menyimpan upload gambar
public_folder: "/images"

collections:
  - name: "pages"
    label: "Halaman Website"
    files:
      - file: "index.html"
        label: "Halaman Utama"
        name: "home"
        fields:
          - { label: "Judul Utama (H1)", name: "title", widget: "string" }
          - { label: "Deskripsi", name: "description", widget: "text" }
