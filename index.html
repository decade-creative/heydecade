<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decade Studio — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --fg:#111111; --muted:#6b6b6b; --line:#dedcd7;
    --accent:#ff9029; --accent-ink:#1a1200;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0c0c0c; --fg:#f3f2ee; --muted:#9a9890; --line:#2a2a28; color-scheme: dark; }
  }
  :root[data-theme="dark"]{ --bg:#0c0c0c; --fg:#f3f2ee; --muted:#9a9890; --line:#2a2a28; color-scheme: dark; }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:'Archivo','Helvetica Neue',Arial,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
  [hidden]{ display:none !important; }

  header{ padding:9vh 6vw 6vh; border-bottom:1px solid var(--line); }
  .eyebrow{ font-size:clamp(1rem, 1.6vw, 1.3rem); font-weight:500; color:var(--muted); margin:0 0 .6rem; }
  .name{
    display:flex; flex-direction:column; width:100%;
    font-size:clamp(2.6rem, 14vw, 9rem); font-weight:900;
    line-height:0.92; letter-spacing:-0.02em; margin:0 0 1.1rem;
  }
  @media (min-width:641px){ .name{ flex-direction:row; justify-content:space-between; align-items:baseline; gap:2vw; } }
  .name span{ transition:color .25s ease; }
  .name span:hover{ color:var(--accent); }
  .tagline{ max-width:46ch; font-size:clamp(1rem,1.6vw,1.2rem); color:var(--muted); margin:0; line-height:1.5; }
  .tagline a{ text-decoration-color:var(--accent); text-underline-offset:3px; }
  .tagline a:hover{ color:var(--accent); }

  main{ padding:6vh 6vw 10vh; }
  .loading{ color:var(--muted); padding:1.5rem 0; grid-column:1/-1; }

  .gallery-scroll{ max-height:80vh; overflow-y:auto; padding-right:.6rem; scrollbar-width:thin; scrollbar-color:var(--muted) transparent; }
  .gallery-scroll::-webkit-scrollbar{ width:6px; }
  .gallery-scroll::-webkit-scrollbar-thumb{ background:var(--muted); }
  .gallery-scroll::-webkit-scrollbar-track{ background:transparent; }

  .gallery{ display:grid; grid-template-columns:repeat(3, 1fr); gap:2vw 1.5vw; }
  @media (max-width:980px){ .gallery{ grid-template-columns:repeat(2, 1fr); } }
  @media (max-width:560px){ .gallery{ grid-template-columns:1fr; gap:3rem; } }

  .gallery-nav{ display:flex; justify-content:center; gap:3rem; margin-top:3rem; padding-top:2rem; border-top:1px solid var(--line); }

  .card{ background:none; border:none; padding:0; text-align:left; font-family:inherit; color:inherit; cursor:pointer; width:100%; }
  .frame{ aspect-ratio:4/3; width:100%; background:var(--line); overflow:hidden; position:relative; transition:transform .4s cubic-bezier(.2,.8,.2,1); }
  .frame img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .img-placeholder{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:.85rem; letter-spacing:.02em; }
  .card:hover .frame, .card:focus-visible .frame{ transform:scale(1.035); }
  .overlay{
    position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; padding:1.1rem;
    background:linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0) 65%);
    opacity:0; transform:translateY(10px); transition:opacity .35s ease, transform .35s ease;
  }
  .card:hover .overlay, .card:focus-visible .overlay{ opacity:1; transform:translateY(0); }
  .ov-title{ color:#fff; font-weight:700; font-size:1.05rem; }
  .ov-cat{ color:rgba(255,255,255,.78); font-size:.82rem; margin-top:.15rem; }
  .accent-bar{ position:absolute; left:0; bottom:0; height:3px; width:0; background:var(--accent); transition:width .4s ease; }
  .card:hover .accent-bar, .card:focus-visible .accent-bar{ width:100%; }

  .backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; padding:4vh 4vw; z-index:50; }
  .backdrop.open{ display:flex; }
  .modal{ background:var(--bg); color:var(--fg); width:min(760px, 100%); max-height:90vh; overflow-y:auto; border:1px solid var(--line); position:relative; }
  .modal-close{ position:absolute; top:.75rem; right:.9rem; z-index:2; background:var(--bg); border:1px solid var(--line); width:2.2rem; height:2.2rem; font-size:1.2rem; line-height:1; cursor:pointer; color:var(--fg); }
  .modal-close:hover{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .modal-frame{ aspect-ratio:4/3; width:100%; background:var(--line); overflow:hidden; position:relative; }
  .modal-frame img{ width:100%; height:100%; object-fit:cover; display:block; }
  .modal-body{ padding:1.75rem 1.75rem 0; }
  .modal-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; }
  .modal-title{ font-size:1.6rem; font-weight:700; margin:0 0 .4rem; }
  .pill{ font-size:.78rem; color:var(--muted); border:1px solid var(--line); padding:.3em .7em; white-space:nowrap; }
  .modal-desc{ color:var(--muted); line-height:1.6; max-width:60ch; margin:1rem 0 1.5rem; }
  .btn{ display:inline-block; border:1px solid var(--fg); background:none; color:var(--fg); padding:.75em 1.3em; font:inherit; font-size:.92rem; cursor:pointer; text-decoration:none; }
  .btn:hover{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .modal-nav{ display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--line); margin-top:1.75rem; padding:1rem 1.75rem; position:sticky; bottom:0; background:var(--bg); }
  .nav-btn{ background:none; border:none; font:inherit; font-size:.92rem; color:var(--muted); cursor:pointer; padding:.4em .2em; }
  .nav-btn:hover{ color:var(--accent); }
  .nav-count{ font-size:.8rem; color:var(--muted); }

  .dash-shell{
    display:flex; min-height:100vh; font-family:'Archivo', system-ui, sans-serif;
    --dbg:#f2f1ee; --dcard:#ffffff; --dtext:#15151a; --dmuted:#8a887f; --dline:#e3e1da; --dside:#121214; --dsidetext:#d8d6cf;
  }
  @media (prefers-color-scheme: dark){
    .dash-shell{ --dbg:#121214; --dcard:#1b1b1e; --dtext:#eceae4; --dmuted:#8a887f; --dline:#2a2a28; --dside:#0a0a0b; --dsidetext:#d8d6cf; }
  }
  .dash-shell{ background:var(--dbg); color:var(--dtext); }
  .dash-sidebar{ width:200px; flex:none; background:var(--dside); color:var(--dsidetext); padding:2.2rem 1.4rem; display:flex; flex-direction:column; gap:2.5rem; }
  .dash-brand{ font-weight:900; font-size:1.05rem; line-height:1.15; letter-spacing:-.01em; color:#fff; }
  .dash-nav{ display:flex; flex-direction:column; gap:.2rem; flex:1; }
  .dash-nav-item{ padding:.6em .7em; font-size:.85rem; color:var(--dmuted); border-left:2px solid transparent; }
  .dash-nav-item.active{ color:#fff; border-left-color:var(--accent); background:rgba(255,255,255,.04); }
  .dash-exit{ font-size:.8rem; color:var(--dmuted); text-decoration:none; }
  .dash-exit:hover{ color:var(--accent); }
  .dash-main{ flex:1; padding:3rem 3.2rem; max-width:980px; }
  .dash-topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:1.6rem; }
  .dash-topbar h1{ font-size:1.5rem; font-weight:900; margin:0; }
  .dash-btn{ background:var(--accent); color:var(--accent-ink); border:none; padding:.7em 1.3em; font:inherit; font-size:.86rem; font-weight:600; cursor:pointer; }
  .dash-btn:hover{ opacity:.88; }
  .dash-stats{ display:flex; gap:1rem; margin-bottom:1.8rem; }
  .dash-stat{ background:var(--dcard); border:1px solid var(--dline); padding:1rem 1.4rem; }
  .dash-stat .n{ display:block; font-size:1.5rem; font-weight:900; }
  .dash-stat .l{ font-size:.76rem; color:var(--dmuted); }
  .dash-table-wrap{ background:var(--dcard); border:1px solid var(--dline); }
  .dash-table-head{ display:grid; grid-template-columns:80px 1fr 130px 130px; gap:1rem; padding:.7rem 1.1rem; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--dmuted); border-bottom:1px solid var(--dline); }
  .admin-row{ display:grid; grid-template-columns:80px 1fr 130px 130px; gap:1rem; align-items:center; padding:.7rem 1.1rem; border-bottom:1px solid var(--dline); }
  .admin-row:last-child{ border-bottom:none; }
  .admin-thumb{ width:56px; aspect-ratio:4/3; background:var(--dline); overflow:hidden; position:relative; }
  .admin-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .admin-info .t{ font-weight:700; font-size:.92rem; }
  .admin-cat{ font-size:.8rem; color:var(--dmuted); }
  .admin-actions{ display:flex; gap:.35rem; }
  .icon-btn{ background:none; border:1px solid var(--dline); width:2rem; height:2rem; cursor:pointer; color:var(--dtext); font-size:.9rem; }
  .icon-btn:hover:not(:disabled){ border-color:var(--accent); color:var(--accent); }
  .icon-btn:disabled{ opacity:.3; cursor:default; }
  .admin-form{ background:var(--dcard); border:1px solid var(--dline); padding:1.4rem; margin-bottom:1.4rem; display:flex; flex-direction:column; gap:.85rem; }
  .admin-form label{ font-size:.78rem; color:var(--dmuted); display:block; margin-bottom:.25rem; }
  .admin-form input[type=text], .admin-form input[type=url], .admin-form select, .admin-form textarea{
    width:100%; border:1px solid var(--dline); background:var(--dbg); color:var(--dtext); padding:.55em .7em; font:inherit; font-size:.9rem;
  }
  .admin-form textarea{ min-height:4.5rem; resize:vertical; }
  .form-preview{ width:120px; aspect-ratio:4/3; background:var(--dline); overflow:hidden; position:relative; margin-bottom:.4rem; }
  .form-preview img{ width:100%; height:100%; object-fit:cover; display:block; }
  .form-actions{ display:flex; gap:.6rem; }
</style>
</head>
<body>

<div id="site-view">
  <header>
    <p class="eyebrow">Hey, We Are</p>
    <h1 class="name"><span>DECADE</span><span>STUDIO</span></h1>
    <p class="tagline">Visual designer working across apparel, packaging, and corporate identity. Based somewhere, available for new work — <a href="mailto:hello@example.com">hello@example.com</a></p>
  </header>

  <main>
    <div class="gallery-scroll"><div class="gallery" id="gallery"><p class="loading">Loading…</p></div></div>
    <div class="gallery-nav">
      <button class="nav-btn" id="galleryPrev">‹ Previous</button>
      <button class="nav-btn" id="galleryNext">Next ›</button>
    </div>
  </main>

  <div class="backdrop" id="backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="closeBtn" aria-label="Close">×</button>
      <div class="modal-frame"><img id="modalImg" alt=""><div class="img-placeholder" id="modalPlaceholder">Image</div></div>
      <div class="modal-body">
        <div class="modal-top">
          <h2 class="modal-title" id="modalTitle"></h2>
          <span class="pill" id="modalCat"></span>
        </div>
        <p class="modal-desc" id="modalDesc"></p>
        <a class="btn" id="modalLink" href="#" target="_blank" rel="noopener">Download</a>
      </div>
      <div class="modal-nav">
        <button class="nav-btn" id="prevBtn">‹ Previous</button>
        <span class="nav-count" id="modalCount"></span>
        <button class="nav-btn" id="nextBtn">Next ›</button>
      </div>
    </div>
  </div>
</div>

<div id="admin-view" hidden>
  <div class="dash-shell">
    <aside class="dash-sidebar">
      <div class="dash-brand">Decade<br>Studio</div>
      <nav class="dash-nav"><span class="dash-nav-item active">Projects</span></nav>
      <a href="#" class="dash-exit">← Back to site</a>
    </aside>
    <div class="dash-main">
    <div class="dash-topbar">
      <h1>Projects</h1>
      <button id="addBtn" class="dash-btn">+ Add project</button>
    </div>
    <div class="dash-stats"><div class="dash-stat"><span class="n" id="statCount">0</span><span class="l">Total projects</span></div></div>
    <div id="adminForm" class="admin-form" hidden>
      <div>
        <label for="fTitle">Title</label>
        <input type="text" id="fTitle" placeholder="Project title">
      </div>
      <div>
        <label for="fCategory">Category</label>
        <select id="fCategory">
          <option>Apparel</option>
          <option>Packaging</option>
          <option>Corporate</option>
        </select>
      </div>
      <div>
        <label for="fDesc">Description</label>
        <textarea id="fDesc" placeholder="Short project description"></textarea>
      </div>
      <div>
        <label for="fHref">Download / external link</label>
        <input type="url" id="fHref" placeholder="https://...">
      </div>
      <div>
        <label>Image</label>
        <div class="form-preview" id="fPreviewBox"><img id="fPreviewImg" alt="" hidden></div>
        <input type="file" id="fFile" accept="image/*">
      </div>
      <div class="form-actions">
        <button id="saveBtn" class="dash-btn">Save</button>
        <button id="cancelBtn" class="icon-btn" style="width:auto;padding:0 1em;" type="button">Cancel</button>
      </div>
    </div>
    <div class="dash-table-wrap">
      <div class="dash-table-head"><span>Preview</span><span>Title</span><span>Category</span><span>Actions</span></div>
      <div id="adminList"><p class="loading">Loading…</p></div>
    </div>
    </div>
  </div>
</div>

<script>
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  let db, assetsApi, isOwner = false;
  let pendingFile = null, editingId = null;
  window.__projects = [];
  window.__admin = [];

  async function initCapabilities(){
    try{
      const claudeNs = window.claude;
      db = claudeNs ? await claudeNs.use('db') : null;
      assetsApi = claudeNs ? await claudeNs.use('assets') : null;
      const user = claudeNs ? await claudeNs.use('user') : null;
      isOwner = user ? await user.isOwner() : false;
    }catch(e){ db = null; assetsApi = null; isOwner = false; }
  }

  function route(){
    const admin = location.hash === '#admin' && isOwner;
    document.getElementById('site-view').hidden = admin;
    document.getElementById('admin-view').hidden = !admin;
    if(admin){ loadAdminList(); } else { loadGallery(); }
  }

  async function loadGallery(){
    const el = document.getElementById('gallery');
    if(!db){ el.innerHTML = '<p class="loading">Gallery unavailable in this view.</p>'; return; }
    try{
      const snap = await db.collection('projects').orderBy('order','asc').get();
      window.__projects = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      if(window.__projects.length === 0){ el.innerHTML = '<p class="loading">No projects yet.</p>'; return; }
      el.innerHTML = window.__projects.map((p,i) => `
        <button class="card" data-index="${i}" aria-label="${esc(p.title)}, ${esc(p.category)}">
          <div class="frame">
            ${p.img ? `<img src="/_blob/${esc(p.img)}" alt="${esc(p.title)} preview" loading="lazy">` : `<div class="img-placeholder">Image</div>`}
            <div class="overlay"><span class="ov-title">${esc(p.title)}</span><span class="ov-cat">${esc(p.category)}</span></div>
            <div class="accent-bar"></div>
          </div>
        </button>
      `).join('');
    }catch(e){ el.innerHTML = '<p class="loading">Could not load projects.</p>'; }
  }

  const backdrop = document.getElementById('backdrop');
  const modalImg = document.getElementById('modalImg');
  const modalPlaceholder = document.getElementById('modalPlaceholder');
  const modalTitle = document.getElementById('modalTitle');
  const modalCat = document.getElementById('modalCat');
  const modalDesc = document.getElementById('modalDesc');
  const modalLink = document.getElementById('modalLink');
  const modalCount = document.getElementById('modalCount');
  let current = 0, lastFocused = null;

  function renderModal(i){
    const list = window.__projects;
    current = (i + list.length) % list.length;
    const p = list[current];
    if(p.img){ modalImg.src = '/_blob/'+p.img; modalImg.hidden = false; modalPlaceholder.hidden = true; }
    else { modalImg.hidden = true; modalPlaceholder.hidden = false; }
    modalTitle.textContent = p.title;
    modalCat.textContent = p.category;
    modalDesc.textContent = p.desc;
    modalLink.href = p.href || '#';
    modalCount.textContent = (current+1) + ' / ' + list.length;
  }
  function openModal(i){
    if(!window.__projects.length) return;
    lastFocused = document.activeElement;
    renderModal(i);
    backdrop.classList.add('open');
    document.getElementById('closeBtn').focus();
    document.addEventListener('keydown', onKey);
  }
  function closeModal(){
    backdrop.classList.remove('open');
    document.removeEventListener('keydown', onKey);
    if(lastFocused) lastFocused.focus();
  }
  function onKey(e){
    if(e.key === 'Escape') closeModal();
    if(e.key === 'ArrowRight') renderModal(current+1);
    if(e.key === 'ArrowLeft') renderModal(current-1);
  }
  document.getElementById('gallery').addEventListener('click', e => {
    const card = e.target.closest('.card');
    if(card) openModal(Number(card.dataset.index));
  });
  document.getElementById('closeBtn').addEventListener('click', closeModal);
  document.getElementById('prevBtn').addEventListener('click', () => renderModal(current-1));
  document.getElementById('nextBtn').addEventListener('click', () => renderModal(current+1));
  backdrop.addEventListener('click', e => { if(e.target === backdrop) closeModal(); });
  document.getElementById('galleryNext').addEventListener('click', () => openModal(0));
  document.getElementById('galleryPrev').addEventListener('click', () => openModal(window.__projects.length - 1));

  // ---- Admin ----
  async function loadAdminList(){
    const el = document.getElementById('adminList');
    if(!db){ el.innerHTML = '<p class="loading">Database unavailable.</p>'; return; }
    try{
      const snap = await db.collection('projects').orderBy('order','asc').get();
      window.__admin = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      renderAdminList();
    }catch(e){ el.innerHTML = '<p class="loading">Could not load projects.</p>'; }
  }
  function renderAdminList(){
    const el = document.getElementById('adminList');
    const items = window.__admin;
    const statEl = document.getElementById('statCount');
    if(statEl) statEl.textContent = items.length;
    if(items.length === 0){ el.innerHTML = '<p class="loading">No projects yet. Add your first one above.</p>'; return; }
    el.innerHTML = items.map((p,i) => `
      <div class="admin-row">
        <div class="admin-thumb">${p.img ? `<img src="/_blob/${esc(p.img)}" alt="">` : ''}</div>
        <div class="admin-info"><div class="t">${esc(p.title)}</div></div>
        <div class="admin-cat">${esc(p.category)}</div>
        <div class="admin-actions">
          <button class="icon-btn" data-up="${i}" ${i===0?'disabled':''} title="Move up">↑</button>
          <button class="icon-btn" data-down="${i}" ${i===items.length-1?'disabled':''} title="Move down">↓</button>
          <button class="icon-btn" data-edit="${i}" title="Edit">✎</button>
          <button class="icon-btn" data-del="${i}" title="Delete">✕</button>
        </div>
      </div>
    `).join('');
  }

  const form = document.getElementById('adminForm');
  const fTitle = document.getElementById('fTitle');
  const fCategory = document.getElementById('fCategory');
  const fDesc = document.getElementById('fDesc');
  const fHref = document.getElementById('fHref');
  const fFile = document.getElementById('fFile');
  const fPreviewImg = document.getElementById('fPreviewImg');

  function openForm(item){
    editingId = item ? item.id : null;
    pendingFile = null;
    fTitle.value = item ? item.title : '';
    fCategory.value = item ? item.category : 'Apparel';
    fDesc.value = item ? item.desc : '';
    fHref.value = (item && item.href && item.href !== '#') ? item.href : '';
    fFile.value = '';
    if(item && item.img){ fPreviewImg.src = '/_blob/'+item.img; fPreviewImg.hidden = false; } else { fPreviewImg.hidden = true; }
    form.hidden = false;
    fTitle.focus();
  }
  function closeForm(){ form.hidden = true; editingId = null; pendingFile = null; }

  document.getElementById('addBtn').addEventListener('click', () => openForm(null));
  document.getElementById('cancelBtn').addEventListener('click', closeForm);
  fFile.addEventListener('change', () => {
    pendingFile = fFile.files[0] || null;
    if(pendingFile){ fPreviewImg.src = URL.createObjectURL(pendingFile); fPreviewImg.hidden = false; }
  });

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const title = fTitle.value.trim();
    if(!title){ alert('Title is required.'); return; }
    if(!db){ alert('Database unavailable.'); return; }
    const data = {
      title, category: fCategory.value, desc: fDesc.value.trim(), href: fHref.value.trim() || '#'
    };
    let imgId = '';
    if(editingId){ const existing = window.__admin.find(p => p.id === editingId); imgId = existing ? (existing.img || '') : ''; }
    if(pendingFile){
      if(!assetsApi){ alert('Image upload unavailable; saving without image.'); }
      else{
        try{ const res = await assetsApi.upload(pendingFile); imgId = res.id; }
        catch(e){ alert('Image upload failed; saving without image change.'); }
      }
    }
    data.img = imgId;
    try{
      if(editingId){
        await db.collection('projects').doc(editingId).update(data);
      } else {
        const maxOrder = window.__admin.reduce((m,p) => Math.max(m, p.order || 0), 0);
        data.order = maxOrder + 1;
        await db.collection('projects').add(data);
      }
      closeForm();
      loadAdminList();
    }catch(e){ alert('Could not save project.'); }
  });

  document.getElementById('adminList').addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if(!btn || !db) return;
    const items = window.__admin;
    if(btn.dataset.edit !== undefined){ openForm(items[Number(btn.dataset.edit)]); }
    else if(btn.dataset.del !== undefined){
      const item = items[Number(btn.dataset.del)];
      if(confirm('Delete "' + item.title + '"?')){
        try{ await db.collection('projects').doc(item.id).delete(); loadAdminList(); }
        catch(err){ alert('Could not delete.'); }
      }
    }
    else if(btn.dataset.up !== undefined){
      const i = Number(btn.dataset.up);
      const a = items[i], b = items[i-1];
      try{
        await db.collection('projects').doc(a.id).update({order:b.order});
        await db.collection('projects').doc(b.id).update({order:a.order});
        loadAdminList();
      }catch(err){ alert('Could not reorder.'); }
    }
    else if(btn.dataset.down !== undefined){
      const i = Number(btn.dataset.down);
      const a = items[i], b = items[i+1];
      try{
        await db.collection('projects').doc(a.id).update({order:b.order});
        await db.collection('projects').doc(b.id).update({order:a.order});
        loadAdminList();
      }catch(err){ alert('Could not reorder.'); }
    }
  });

  window.addEventListener('hashchange', route);
  (async function(){ await initCapabilities(); route(); })();
</script>
</body>
</html>
