<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decade Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --fg:#111111; --muted:#6b6b6b; --line:#dedcd7;
    --accent:#ff9029; --accent-ink:#1a1200;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0c0c0c; --fg:#f3f2ee; --muted:#9a9890; --line:#2a2a28;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c0c0c; --fg:#f3f2ee; --muted:#9a9890; --line:#2a2a28;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:'Archivo','Helvetica Neue',Arial,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:3px;}

  header{ padding:9vh 6vw 6vh; border-bottom:1px solid var(--line); }
  .eyebrow{
    font-size:clamp(1rem, 1.6vw, 1.3rem); font-weight:500;
    color:var(--muted); margin:0 0 .6rem;
  }
  .name{
    display:flex; flex-direction:column; width:100%;
    font-size:clamp(2.6rem, 14vw, 9rem); font-weight:900;
    line-height:0.92; letter-spacing:-0.02em; margin:0 0 1.1rem;
  }
  @media (min-width:641px){
    .name{ flex-direction:row; justify-content:space-between; align-items:baseline; gap:2vw; }
  }
  .name span{ transition:color .25s ease; }
  .name span:hover{ color:var(--accent); }
  .tagline{ max-width:46ch; font-size:clamp(1rem,1.6vw,1.2rem); color:var(--muted); margin:0; line-height:1.5; }
  .tagline a{ text-decoration-color:var(--accent); text-underline-offset:3px; }
  .tagline a:hover{ color:var(--accent); }

  main{ padding:6vh 6vw 10vh; }

  .gallery-scroll{
    max-height:80vh; overflow-y:auto; padding-right:.6rem;
    scrollbar-width:thin; scrollbar-color:var(--muted) transparent;
  }
  .gallery-scroll::-webkit-scrollbar{ width:6px; }
  .gallery-scroll::-webkit-scrollbar-thumb{ background:var(--muted); }
  .gallery-scroll::-webkit-scrollbar-track{ background:transparent; }

  .gallery{ display:grid; grid-template-columns:repeat(3, 1fr); gap:2vw 1.5vw; }
  @media (max-width:980px){ .gallery{ grid-template-columns:repeat(2, 1fr); } }
  @media (max-width:560px){ .gallery{ grid-template-columns:1fr; gap:3rem; } }

  .gallery-nav{
    display:flex; justify-content:center; gap:3rem;
    margin-top:3rem; padding-top:2rem; border-top:1px solid var(--line);
  }

  .card{ background:none; border:none; padding:0; text-align:left; font-family:inherit; color:inherit; cursor:pointer; width:100%; }
  .frame{
    aspect-ratio:4/3; width:100%; background:var(--line);
    overflow:hidden; position:relative;
    transition:transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .frame img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .card:hover .frame, .card:focus-visible .frame{ transform:scale(1.035); }
  .overlay{
    position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end;
    padding:1.1rem; background:linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0) 65%);
    opacity:0; transform:translateY(10px); transition:opacity .35s ease, transform .35s ease;
  }
  .card:hover .overlay, .card:focus-visible .overlay{ opacity:1; transform:translateY(0); }
  .ov-title{ color:#fff; font-weight:700; font-size:1.05rem; }
  .ov-cat{ color:rgba(255,255,255,.78); font-size:.82rem; margin-top:.15rem; }
  .accent-bar{
    position:absolute; left:0; bottom:0; height:3px; width:0;
    background:var(--accent); transition:width .4s ease;
  }
  .card:hover .accent-bar, .card:focus-visible .accent-bar{ width:100%; }

  .backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; padding:4vh 4vw; z-index:50;
  }
  .backdrop.open{ display:flex; }
  .modal{
    background:var(--bg); color:var(--fg); width:min(760px, 100%); max-height:90vh;
    overflow-y:auto; border:1px solid var(--line); position:relative;
  }
  .modal-close{
    position:absolute; top:.75rem; right:.9rem; z-index:2; background:var(--bg); border:1px solid var(--line);
    width:2.2rem; height:2.2rem; font-size:1.2rem; line-height:1; cursor:pointer; color:var(--fg);
  }
  .modal-close:hover{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .modal-frame{ aspect-ratio:4/3; width:100%; background:var(--line); overflow:hidden; }
  .modal-frame img{ width:100%; height:100%; object-fit:cover; display:block; }
  .modal-body{ padding:1.75rem 1.75rem 0; }
  .modal-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; }
  .modal-title{ font-size:1.6rem; font-weight:700; margin:0 0 .4rem; }
  .pill{ font-size:.78rem; color:var(--muted); border:1px solid var(--line); padding:.3em .7em; white-space:nowrap; }
  .modal-desc{ color:var(--muted); line-height:1.6; max-width:60ch; margin:1rem 0 1.5rem; }
  .btn{
    display:inline-block; border:1px solid var(--fg); background:none; color:var(--fg);
    padding:.75em 1.3em; font:inherit; font-size:.92rem; cursor:pointer; text-decoration:none;
  }
  .btn:hover{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  .modal-nav{
    display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--line);
    margin-top:1.75rem; padding:1rem 1.75rem; position:sticky; bottom:0; background:var(--bg);
  }
  .nav-btn{ background:none; border:none; font:inherit; font-size:.92rem; color:var(--muted); cursor:pointer; padding:.4em .2em; }
  .nav-btn:hover{ color:var(--accent); }
  .nav-count{ font-size:.8rem; color:var(--muted); }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Hey, We Are</p>
  <h1 class="name" id="judul-web">DECADE STUDIO</h1>
<p class="tagline">
  <span id="deskripsi-web">Visual designer working across apparel...</span> — 
  <a id="email-web" href="mailto:hello@example.com">hello@example.com</a>
</p>
</header>

<main>
  <div class="gallery-scroll">
    <div class="gallery" id="gallery"></div>
  </div>
  <div class="gallery-nav">
    <button class="nav-btn" id="galleryPrev">‹ Previous</button>
    <button class="nav-btn" id="galleryNext">Next ›</button>
  </div>
</main>

<div class="backdrop" id="backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="closeBtn" aria-label="Close">×</button>
    <div class="modal-frame"><img id="modalImg" alt=""></div>
    <div class="modal-body">
      <div class="modal-top">
        <h2 class="modal-title" id="modalTitle"></h2>
        <span class="pill" id="modalCat"></span>
      </div>
      <p class="modal-desc" id="modalDesc"></p>
      <a class="btn" id="modalLink" href="#" target="_blank" rel="noopener">Download</a>
    </div>
    <div class="modal-nav">
      <button class="nav-btn" id="prevBtn">‹ Previous</button>
      <span class="nav-count" id="modalCount"></span>
      <button class="nav-btn" id="nextBtn">Next ›</button>
    </div>
  </div>
</div>

  const gallery = document.getElementById('gallery');
  gallery.innerHTML = projects.map((p,i) => `
    <button class="card" data-index="${i}" aria-label="${p.title}, ${p.category}">
      <div class="frame">
        <img src="${p.img}" alt="${p.title} preview" loading="lazy">
        <div class="overlay"><span class="ov-title">${p.title}</span><span class="ov-cat">${p.category}</span></div>
        <div class="accent-bar"></div>
      </div>
    </button>
  `).join('');

  const backdrop = document.getElementById('backdrop');
  const modalImg = document.getElementById('modalImg');
  const modalTitle = document.getElementById('modalTitle');
  const modalCat = document.getElementById('modalCat');
  const modalDesc = document.getElementById('modalDesc');
  const modalLink = document.getElementById('modalLink');
  const modalCount = document.getElementById('modalCount');
  let current = 0;
  let lastFocused = null;

  function render(i){
    current = (i + projects.length) % projects.length;
    const p = projects[current];
    modalImg.src = p.img;
    modalImg.alt = p.title + ' preview';
    modalTitle.textContent = p.title;
    modalCat.textContent = p.category;
    modalDesc.textContent = p.desc;
    modalLink.href = p.href;
    modalCount.textContent = (current+1) + ' / ' + projects.length;
  }

  function openModal(i){
    lastFocused = document.activeElement;
    render(i);
    backdrop.classList.add('open');
    document.getElementById('closeBtn').focus();
    document.addEventListener('keydown', onKey);
  }
  function closeModal(){
    backdrop.classList.remove('open');
    document.removeEventListener('keydown', onKey);
    if(lastFocused) lastFocused.focus();
  }
  function onKey(e){
    if(e.key === 'Escape') closeModal();
    if(e.key === 'ArrowRight') render(current+1);
    if(e.key === 'ArrowLeft') render(current-1);
  }

  gallery.addEventListener('click', e => {
    const card = e.target.closest('.card');
    if(card) openModal(Number(card.dataset.index));
  });
  document.getElementById('closeBtn').addEventListener('click', closeModal);
  document.getElementById('prevBtn').addEventListener('click', () => render(current-1));
  document.getElementById('nextBtn').addEventListener('click', () => render(current+1));
  backdrop.addEventListener('click', e => { if(e.target === backdrop) closeModal(); });
  document.getElementById('galleryNext').addEventListener('click', () => openModal(0));
  document.getElementById('galleryPrev').addEventListener('click', () => openModal(projects.length - 1));
</script>
<script>
  fetch('/data.json')
    .then(response => response.json())
    .then(data => {
      if(data.judul) document.getElementById('judul-web').innerText = data.judul;
      if(data.deskripsi) document.getElementById('deskripsi-web').innerText = data.deskripsi;
    })
    .catch(err => console.log("Data CMS belum tersedia."));
</script>
</body>
